name: Bug report
description: Report an incorrect decision, integration failure, or installation problem.
body:
  - type: markdown
    attributes:
      value: |
        Use synthetic examples. Do not paste API keys, personal transcripts, private source code, or full environment dumps. For security-sensitive reports, read SECURITY.md first.
  - type: input
    id: versions
    attributes:
      label: Versions and platform
      description: Jevusher version or commit, Node version, operating system, and Claude version if relevant.
      placeholder: Jevusher commit …; Node …; macOS/Linux …; Claude …
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where does it happen?
      options:
        - Claude Code hooks
        - Local test UI
        - Library or CLI
        - Installation or packaging
        - Documentation
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Commands, configuration names, and a small synthetic input. Omit secret values.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include a redacted error or decision and whether the original content remained available.
    validations:
      required: true
